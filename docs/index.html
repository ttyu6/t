<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pristine Design · v2.0</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="_assets/help.css">
</head>
<body>
  <div id="app">加载中…</div>

  <script>
    window.$docsify = {
      name: 'Pristine Design',
      repo: 'liysoft/t',
      homepage: 'index.md',
      loadSidebar: '_sidebar.md',
      coverpage: '_coverpage.md',
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      search: {
        placeholder: '搜索组件 / API…',
        noData: '没有找到结果',
        depth: 4
      },
      copyCode: { buttonText: '复制', errorText: '复制失败' },
      pagination: { previousText: '上一页', nextText: '下一页' }
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2"></script>
  <script>
    // 让页内锚点（#pd-xxx）滚动而非触发路由跳转
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href^="#pd-"]');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      var el = document.getElementById(a.getAttribute('href').slice(1));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, true);
  </script>
</head>
</body>
</html>
